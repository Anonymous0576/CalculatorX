<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scientific & Engineering Calculator</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --glass: rgba(255, 255, 255, 0.09);
      --line: rgba(255, 255, 255, 0.16);
      --text: #f5f7ff;
      --muted: #aab4d0;
      --blue: #42d9ff;
      --violet: #9c76ff;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 14px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 18% 18%, #392e7e 0, transparent 36%),
        radial-gradient(ellipse at 82% 78%, #075d75 0, transparent 34%),
        linear-gradient(135deg, #090d1c, #111b32 55%, #090d1c);
    }

    .glow {
      position: fixed;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(80px);
      opacity: .35;
    }

    .glow.one { top: 4%; left: 5%; background: #8d5cff; }
    .glow.two { right: 3%; bottom: 3%; background: #00d9ff; }

    .calculator {
      position: relative;
      width: min(760px, 100%);
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.035));
      box-shadow:
        0 30px 80px rgba(0,0,0,.5),
        inset 1px 1px 1px rgba(255,255,255,.2),
        inset -2px -2px 8px rgba(0,0,0,.25);
      backdrop-filter: blur(22px);
      transform: perspective(1200px) rotateX(1deg);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.05rem, 3vw, 1.4rem);
      letter-spacing: .04em;
    }

    .badge {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #b6f3ff;
      font-size: .72rem;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .screen {
      min-height: 110px;
      margin-bottom: 15px;
      padding: 15px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      border: 1px solid rgba(95, 220, 255, .26);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(2, 9, 23, .92), rgba(18, 30, 55, .8));
      box-shadow: inset 0 5px 18px #0008, 0 0 24px #35d7ff12;
    }

    #expression {
      min-height: 20px;
      color: var(--muted);
      font-size: .88rem;
      text-align: right;
      overflow-wrap: anywhere;
    }

    #display {
      width: 100%;
      padding: 4px 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #f7fcff;
      font: 500 clamp(1.8rem, 7vw, 2.8rem) ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: right;
      text-shadow: 0 0 18px #42d9ff55;
    }

    #status {
      color: #7fe6ff;
      font-size: .74rem;
      text-align: right;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 9px;
    }

    button {
      min-height: 48px;
      padding: 7px 4px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 13px;
      color: var(--text);
      background: linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.045));
      box-shadow: 0 5px 0 rgba(0,0,0,.3), 0 8px 18px #0002, inset 0 1px 0 #ffffff20;
      font: 600 .95rem ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
      user-select: none;
      transition: transform .12s, filter .12s, box-shadow .12s;
    }

    button:hover {
      filter: brightness(1.28);
      border-color: #9beaff88;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 rgba(0,0,0,.3), inset 0 1px 4px #0005;
    }

    button.function { color: #b9c9ff; }
    button.operator {
      color: #d7c6ff;
      background: linear-gradient(145deg, #6544ad, #392b71);
    }
    button.prefix { color: #9cf3e0; }
    button.utility {
      color: #ffb8ca;
      background: linear-gradient(145deg, #8d3e64, #512846);
    }
    button.equals {
      color: #07151b;
      background: linear-gradient(145deg, #69f2ff, #36b9df);
      box-shadow: 0 5px 0 #16738a, 0 8px 18px #1bcfff22, inset 0 1px 0 #ffffffaa;
    }
    button.wide { grid-column: span 2; }

    .legend {
      margin: 15px 2px 0;
      color: var(--muted);
      font-size: .75rem;
      line-height: 1.5;
    }

    @media (max-width: 520px) {
      .calculator { padding: 15px; border-radius: 22px; }
      .keys { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
      button { min-height: 46px; font-size: .88rem; }
      .badge { font-size: .62rem; }
    }
  </style>
</head>
<body>
  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="calculator">
    <header>
      <h1>Scientific / Engineering</h1>
      <span class="badge">3D OPTICAL • SI</span>
    </header>

    <section class="screen" aria-label="Calculator display">
      <div id="expression" aria-live="polite"></div>
      <input id="display" value="0" aria-label="Current value" readonly />
      <div id="status">DEG • STANDARD</div>
    </section>

    <section class="keys" aria-label="Calculator keys">
      <button class="utility" data-action="clear">AC</button>
      <button class="utility" data-action="delete">DEL</button>
      <button class="function" data-action="toggle-sign">±</button>
      <button class="function" data-action="percent">%</button>
      <button class="function" data-action="angle">DEG</button>
      <button class="function" data-action="engineering">ENG</button>
      <button class="operator" data-op="mod">mod</button>
      <button class="operator" data-op="divide">÷</button>

      <button class="function" data-fn="sin">sin</button>
      <button class="function" data-fn="cos">cos</button>
      <button class="function" data-fn="tan">tan</button>
      <button class="function" data-fn="asin">sin⁻¹</button>
      <button class="function" data-fn="acos">cos⁻¹</button>
      <button class="function" data-fn="atan">tan⁻¹</button>
      <button class="function" data-fn="sqrt">√x</button>
      <button class="operator" data-op="multiply">×</button>

      <button class="function" data-fn="log">log</button>
      <button class="function" data-fn="ln">ln</button>
      <button class="function" data-fn="exp">eˣ</button>
      <button class="function" data-fn="tenpow">10ˣ</button>
      <button class="function" data-fn="square">x²</button>
      <button class="function" data-fn="cube">x³</button>
      <button class="function" data-fn="reciprocal">1/x</button>
      <button class="operator" data-op="subtract">−</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="function" data-fn="factorial">x!</button>
      <button class="function" data-fn="abs">|x|</button>
      <button class="function" data-fn="pi">π</button>
      <button class="function" data-fn="e">e</button>
      <button class="operator" data-op="add">+</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-op="power">xʸ</button>
      <button class="function" data-fn="root3">∛x</button>
      <button class="function" data-fn="round">round</button>
      <button class="function" data-fn="floor">floor</button>
      <button class="equals" data-action="equals">=</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button data-digit="0">0</button>
      <button data-action="decimal">.</button>
      <button class="prefix" data-prefix="1e-12">p</button>
      <button class="prefix" data-prefix="1e-9">n</button>
      <button class="prefix" data-prefix="1e-6">µ</button>

      <button class="prefix" data-prefix="1e-3">m</button>
      <button class="prefix" data-prefix="1e3">k</button>
      <button class="prefix" data-prefix="1e6">M</button>
      <button class="prefix" data-prefix="1e9">G</button>
      <button class="prefix" data-prefix="1e12">T</button>
      <button class="function" data-fn="ten">×10</button>
      <button class="function" data-fn="pi2">π/2</button>
      <button class="function" data-fn="pi4">π/4</button>
    </section>

    <p class="legend">
      SI prefix keys multiply the current value. ENG switches between standard and engineering notation.
      Keyboard: digits, + − * /, Enter, Backspace, Esc.
    </p>
  </main>

  <script>
    const display = document.querySelector("#display");
    const expressionLine = document.querySelector("#expression");
    const statusLine = document.querySelector("#status");
    const keys = document.querySelector(".keys");

    let value = 0;
    let storedValue = null;
    let pendingOperation = null;
    let startNewNumber = true;
    let degrees = true;
    let engineering = false;
    let error = false;

    const operationSymbols = {
      add: "+", subtract: "−", multiply: "×",
      divide: "÷", power: "^", mod: "mod"
    };

    function prettyNumber(number) {
      if (!Number.isFinite(number)) return "Error";
      if (Object.is(number, -0)) number = 0;

      if (engineering && number !== 0) {
        const exponent = Math.floor(Math.log10(Math.abs(number)) / 3) * 3;
        const mantissa = number / (10 ** exponent);
        return `${Number(mantissa.toPrecision(9))}e${exponent >= 0 ? "+" : ""}${exponent}`;
      }

      return Number(number.toPrecision(12)).toString();
    }

    function update() {
      display.value = prettyNumber(value);
      statusLine.textContent =
        `${degrees ? "DEG" : "RAD"} • ${engineering ? "ENGINEERING" : "STANDARD"}`;
    }

    function showError(message = "Error") {
      error = true;
      display.value = message;
      expressionLine.textContent = "";
    }

    function clearAll() {
      value = 0;
      storedValue = null;
      pendingOperation = null;
      startNewNumber = true;
      error = false;
      expressionLine.textContent = "";
      update();
    }

    function calculate(a, b, operation) {
      switch (operation) {
        case "add": return a + b;
        case "subtract": return a - b;
        case "multiply": return a * b;
        case "divide": return b === 0 ? NaN : a / b;
        case "power": return a ** b;
        case "mod": return b === 0 ? NaN : a % b;
        default: return b;
      }
    }

    function chooseOperation(operation) {
      if (error) clearAll();

      if (pendingOperation && !startNewNumber) {
        value = calculate(storedValue, value, pendingOperation);
        if (!Number.isFinite(value)) return showError("Math error");
        update();
      }

      storedValue = value;
      pendingOperation = operation;
      startNewNumber = true;
      expressionLine.textContent =
        `${prettyNumber(storedValue)} ${operationSymbols[operation]}`;
    }

    function equals() {
      if (!pendingOperation || storedValue === null) return;
      const left = storedValue;
      const right = value;
      const symbol = operationSymbols[pendingOperation];
      value = calculate(left, right, pendingOperation);

      if (!Number.isFinite(value)) return showError("Math error");

      expressionLine.textContent =
        `${prettyNumber(left)} ${symbol} ${prettyNumber(right)} =`;
      storedValue = null;
      pendingOperation = null;
      startNewNumber = true;
      update();
    }

    function factorial(n) {
      if (!Number.isInteger(n) || n < 0 || n > 170) return NaN;
      let result = 1;
      for (let i = 2; i <= n; i++) result *= i;
      return result;
    }

    function applyFunction(name) {
      if (error) clearAll();

      const angle = degrees ? Math.PI / 180 : 1;
      const inverseAngle = degrees ? 180 / Math.PI : 1;
      const x = value;
      let result;

      switch (name) {
        case "sin": result = Math.sin(x * angle); break;
        case "cos": result = Math.cos(x * angle); break;
        case "tan": result = Math.tan(x * angle); break;
        case "asin": result = Math.asin(x) * inverseAngle; break;
        case "acos": result = Math.acos(x) * inverseAngle; break;
        case "atan": result = Math.atan(x) * inverseAngle; break;
        case "sqrt": result = Math.sqrt(x); break;
        case "root3": result = Math.cbrt(x); break;
        case "log": result = Math.log10(x); break;
        case "ln": result = Math.log(x); break;
        case "exp": result = Math.exp(x); break;
        case "tenpow": result = 10 ** x; break;
        case "square": result = x ** 2; break;
        case "cube": result = x ** 3; break;
        case "reciprocal": result = 1 / x; break;
        case "factorial": result = factorial(x); break;
        case "abs": result = Math.abs(x); break;
        case "round": result = Math.round(x); break;
        case "floor": result = Math.floor(x); break;
        case "pi": result = Math.PI; break;
        case "e": result = Math.E; break;
        case "ten": result = x * 10; break;
        case "pi2": result = Math.PI / 2; break;
        case "pi4": result = Math.PI / 4; break;
        default: return;
      }

      if (!Number.isFinite(result)) return showError("Math error");

      expressionLine.textContent = `${name}( ${prettyNumber(x)} )`;
      value = result;
      startNewNumber = true;
      update();
    }

    function enterDigit(digit) {
      if (error) clearAll();

      if (startNewNumber) {
        value = Number(digit);
        startNewNumber = false;
      } else {
        const current = String(value);
        value = Number(current === "0" ? digit : current + digit);
      }

      update();
    }

    function enterDecimal() {
      if (error) clearAll();

      if (startNewNumber) {
        value = 0;
        startNewNumber = false;
      }

      if (!String(value).includes(".")) {
        // Keep decimal entry straightforward, including after a prior operation.
        const current = String(value);
        value = Number(`${current}.`);
        display.value = `${current}.`;
      } else {
        update();
      }
    }

    function deleteDigit() {
      if (error) return clearAll();
      if (startNewNumber) return;

      const text = String(value);
      const shortened = text.length > 1 ? text.slice(0, -1) : "0";
      value = Number(shortened || "0");
      update();
    }

    function handleAction(action) {
      if (action === "clear") return clearAll();
      if (action === "delete") return deleteDigit();
      if (action === "equals") return equals();

      if (error) clearAll();

      if (action === "decimal") return enterDecimal();

      if (action === "toggle-sign") {
        value = -value;
        update();
      } else if (action === "percent") {
        value /= 100;
        update();
      } else if (action === "angle") {
        degrees = !degrees;
        update();
      } else if (action === "engineering") {
        engineering = !engineering;
        update();
      }
    }

    keys.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      if (button.dataset.digit !== undefined) {
        enterDigit(button.dataset.digit);
      } else if (button.dataset.op) {
        chooseOperation(button.dataset.op);
      } else if (button.dataset.fn) {
        applyFunction(button.dataset.fn);
      } else if (button.dataset.prefix) {
        value *= Number(button.dataset.prefix);
        startNewNumber = true;
        update();
      } else if (button.dataset.action) {
        handleAction(button.dataset.action);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (/^\d$/.test(event.key)) return enterDigit(event.key);
      if (event.key === ".") return enterDecimal();
      if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        return equals();
      }
      if (event.key === "Escape") return clearAll();
      if (event.key === "Backspace") return deleteDigit();

      const operators = {
        "+": "add", "-": "subtract", "*": "multiply",
        "/": "divide", "^": "power", "%": "mod"
      };
      if (operators[event.key]) chooseOperation(operators[event.key]);
    });

    update();
  </script>
</body>
</html>
